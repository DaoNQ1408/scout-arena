      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RoundResponse'
        "400":
          description: Lỗi validation
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Tạo mới một vòng đấu
      tags:
      - rounds
